name: Weekly pipeline

on:
  schedule:
    # 12:00 UTC Sunday (8am ET during DST, 7am ET otherwise)
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m src.pipeline.run_weekly_pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/outputs/predictions_latest.csv
          git diff --cached --quiet || git commit -m "Update weekly predictions"
          git push
